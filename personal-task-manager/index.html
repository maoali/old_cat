<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人事务管理</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 个人事务管理</h1>
            <p class="subtitle">简洁高效的事务提醒工具</p>
        </header>

        <div class="add-task-section">
            <h2>添加新事务</h2>
            <form id="taskForm">
                <div class="form-group">
                    <label for="taskTitle">事务标题</label>
                    <input type="text" id="taskTitle" placeholder="输入事务标题..." required>
                </div>

                <div class="form-group">
                    <label for="taskDescription">描述（可选）</label>
                    <textarea id="taskDescription" placeholder="添加详细描述..." rows="3"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="taskDate">日期</label>
                        <input type="date" id="taskDate" required>
                    </div>

                    <div class="form-group">
                        <label for="taskTime">时间</label>
                        <input type="time" id="taskTime" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="taskPriority">优先级</label>
                    <select id="taskPriority">
                        <option value="low">低</option>
                        <option value="medium" selected>中</option>
                        <option value="high">高</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">添加事务</button>
            </form>
        </div>

        <div class="tasks-section">
            <div class="tasks-header">
                <h2>我的事务</h2>
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">全部</button>
                    <button class="filter-btn" data-filter="pending">待处理</button>
                    <button class="filter-btn" data-filter="completed">已完成</button>
                </div>
            </div>

            <div id="tasksList" class="tasks-list">
                <!-- 事务列表将在这里动态生成 -->
            </div>

            <div id="emptyState" class="empty-state" style="display: none;">
                <p>📝 暂无事务，添加一个新事务开始吧！</p>
            </div>
        </div>
    </div>

    <!-- 提醒通知弹窗 -->
    <div id="notificationModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>⏰ 事务提醒</h3>
                <button class="close-btn" onclick="closeNotification()">&times;</button>
            </div>
            <div class="modal-body">
                <p id="notificationText"></p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="closeNotification()">知道了</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
